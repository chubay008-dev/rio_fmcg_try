version: 1

services:
  - name: rio-fmcg-website
    type: web
    env: node
    plan: free
    region: oregon
    repo: chubay008-dev/rio_fmcg_try
    branch: main

    buildCommand: npm ci && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_VERSION
        value: "20"

      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://otwohdxdmegvthauphuq.supabase.co

      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

      - key: NEXT_PUBLIC_ZALO_CHAT_LINK
        value: https://zalo.me/r/botcreator/

      - key: ZALO_BOT_TOKEN
        sync: false

      - key: ZALO_BOT_WEBHOOK_SECRET
        sync: false

    healthCheckPath: /api/zalo/webhook
    autoDeploy: true
